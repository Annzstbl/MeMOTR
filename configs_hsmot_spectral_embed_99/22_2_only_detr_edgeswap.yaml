PROJECT: "只训练DETR+EdgeSwap+修正gt的flip计算+l1损失计算权重"

PARENT_CONFIG: ./default99.yaml

AVAILABLE_GPUS: 2,3  #if not set, will use all gpus

USE_CHECKPOINT: False
DYNAMIC_USE_CHECKPOINT_THRESHOLD: 5
CHECKPOINT_LEVEL: 3               # gradient checkpoint level.
                                  # As the number increases (from 1 to 4), the memory cost increases.
                                  # We have deleted many comments in this official code simplicity,
                                  # if you have any questions, feel free to contact with the author.
SAMPLE_LENGTHS: [1,1,1,1]

OUTPUTS_DIR: /data/users/wangying01/lth/hsmot/workdir_2/memotr/spectralemb/22_only_detr_edgeswap
SUBMIT_DIR: /data/users/wangying01/lth/hsmot/workdir_2/memotr/spectralemb/22_only_detr_edgeswap


ENCODER_SPECTRAL: True

TRAIN_HALF: True

SCEM:
  ENABLE: True
  WITH_FOREGROUND: False
  PRIOR_MODE: gate
  USE_SPECTRAL_PI: True

LOSS_SCEM_NLL: 1
LOSS_SCEM_BCE: 1
LOSS_SCEM_DICE: 1
LOSS_NLL_CONFIG:
  TYPE: focal # focal or mean
  ALPHA_POS: 1.0
  ALPHA_NEG: 0.1
  GAMMA_POS: 2.0
  GAMMA_NEG: 0.0

ONLY_TRAIN_DETR: True

BATCH_SIZE: 3
EPOCHS: 40

EDGE_SWAP: True