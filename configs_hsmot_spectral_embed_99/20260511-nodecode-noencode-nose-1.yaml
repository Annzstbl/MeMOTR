PROJECT: "20260511-nodecode-noencode-nose-1，stem 光谱融合，encode/decode 均不使用 spectral"

AVAILABLE_GPUS: "0,1"

PARENT_CONFIG: ./default.yaml
OUTPUTS_DIR: /data4/litianhao/hsmot/memotr/spectralemb/20260511-nodecode-noencode-nose-1-autodl
SUBMIT_DIR: /data4/litianhao/hsmot/memotr/spectralemb/20260511-nodecode-noencode-nose-1-autodl


#新增
TRACK_IOU_ADAPTIVE: False
TRACK_IOU_THRESH: 0.2


##不变

# checkpoint
USE_CHECKPOINT: True
DYNAMIC_USE_CHECKPOINT_THRESHOLD: 5
CHECKPOINT_LEVEL: 1         # 1： encoder  2: encoder+decoder  3: encoder+decoder+backbone

# 最佳transform
TRANSFORMS_CONFIG:
  CROP_SIZE:
    - 800
    - 1200
  FLIP_RATIO: 0.5
  RESIZE:
    - 880
    - 960
    - 1040
    - 1120
    - 1200
    - 1280

SAMPLE_LENGTHS: [2, 3, 4, 5]

# -------------训练配置-------------
TRAIN_HALF: False
ONLY_TRAIN_DETR: False
NUM_WORKERS: 4
DATASET_TYPE: 3JPG # NPY

# -------------模型配置-------------
ENCODER_SPECTRAL: False
EDGE_SWAP: True
STEM: conv3d_se_v4
SPECTRAL_WEIGHTS_VERSION: v5
MEMOTR_VERSION: '20260511_nodecode_noencode_nose'
TIMING_SYNC_CUDA: False
TIMING_LOG_INTERVAL: 10

# AMP: set USE_AMP True to enable (see PARENT_CONFIG default.yaml for AMP_DTYPE)
USE_AMP: False
AMP_DTYPE: bf16

# -------------SCEM配置-------------
SCEM:
  ENABLE: False
  USE_GT: False
  PRIOR_MODE: gate
  USE_SPECTRAL_PI: False
  SPECTRAL_DATABASE_NUM: 32
  SPECTRAL_TYPE: "pi"
  GRAD_MODE: conservative

# -------------LOSS配置-------------
LOSS_SCEM_NLL: 0
LOSS_SCEM_BCE: 0
LOSS_SCEM_DICE: 0
LOSS_NLL_CONFIG:
  TYPE: focal # focal or mean
  ALPHA_POS: 1.0
  ALPHA_NEG: 0.1
  GAMMA_POS: 2.0
  GAMMA_NEG: 0.0
LOSS_SCEM_POOL_DIV: 0
LOSS_SCEM_GAMMA_COVER: 0
LOSS_LABEL_TYPE: sigmoid_focal_loss

LOSS_WEIGHT_FOCAL: 5
LOSS_WEIGHT_GIOU: 2
LOSS_WEIGHT_L1: 5

MATCH_COST_CLASS: 5
MATCH_COST_BBOX: 5
MATCH_COST_GIOU: 2

# -------------CHECKPOINT配置-------------

CHECKPOINT_EVERY_N_EPOCHS: 5
CHECKPOINT_TAIL_EPOCHS: 3

EVALUATE_EVERY_N_EPOCHS: 5
EVALUATE_TAIL_EPOCHS: 3
EVALUATE_FORCE_EPOCHS: []


