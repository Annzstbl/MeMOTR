PROJECT: "20260511-nodecode,在decoder中不使用spec"

AVAILABLE_GPUS: "2,3"

PARENT_CONFIG: ./default.yaml
OUTPUTS_DIR: /data4/litianhao/hsmot/memotr/spectralemb/20260511-nodecode-2-99
SUBMIT_DIR: /data4/litianhao/hsmot/memotr/spectralemb/20260511-nodecode-2-99


#新增
TRACK_IOU_ADAPTIVE: False
TRACK_IOU_THRESH: 0.5


##不变

# checkpoint
USE_CHECKPOINT: True
DYNAMIC_USE_CHECKPOINT_THRESHOLD: 4
CHECKPOINT_LEVEL: 1         # 1： encoder  2: encoder+decoder  3: encoder+decoder+backbone

# 最佳transform
TRANSFORMS_CONFIG:
  CROP_SIZE:
    - 800
    - 1200
  FLIP_RATIO: 0.5
  RESIZE:
    - 880
    - 960
    - 1040
    - 1120
    - 1200
    - 1280

# === 单阶段 MOT 训练（无 STAGE1）===
# EPOCHS: 18
# SAMPLE_STEPS: [4, 8, 12]
SAMPLE_LENGTHS: [2, 3, 4, 5]
# SAMPLE_MODES: [random_interval]
# SAMPLE_INTERVALS: [3]

# LR_SCHEDULER: MultiStep
# LR_DROP_RATE: 0.1
# LR_DROP_MILESTONES: [12]
USE_AMP: True
AMP_DTYPE: bf16

# -------------训练配置-------------
TRAIN_HALF: False
ONLY_TRAIN_DETR: False
# DATASET_VERSION: OnePic
NUM_WORKERS: 4
DATASET_TYPE: 3JPG # NPY


# -------------模型配置-------------
ENCODER_SPECTRAL: True
EDGE_SWAP: True
STEM: conv3d_se_v4
MEMOTR_VERSION: '20260511_nodecode'
TIMING_SYNC_CUDA: False
TIMING_LOG_INTERVAL: 10

# -------------SCEM配置-------------
SCEM:
  ENABLE: True
  USE_GT: False
  PRIOR_MODE: gate
  USE_SPECTRAL_PI: True
  SPECTRAL_DATABASE_NUM: 32
  SPECTRAL_TYPE: "pi"
  # 梯度路由：conservative | grad_scaled（见 model_20260511/SCEM.py）
  GRAD_MODE: conservative

# -------------LOSS配置-------------
LOSS_SCEM_NLL: 1
LOSS_SCEM_BCE: 1
LOSS_SCEM_DICE: 0
LOSS_NLL_CONFIG:
  TYPE: focal # focal or mean
  ALPHA_POS: 1.0
  ALPHA_NEG: 0.1
  GAMMA_POS: 2.0
  GAMMA_NEG: 0.0
LOSS_SCEM_POOL_DIV: 1
LOSS_SCEM_GAMMA_COVER: 1
LOSS_LABEL_TYPE: sigmoid_focal_loss
LOSS_WEIGHT_FOCAL: 3
LOSS_WEIGHT_GIOU: 2
MATCH_COST_CLASS: 3
MATCH_COST_BBOX: 5
MATCH_COST_GIOU: 2

# -------------CHECKPOINT配置（共 20 epoch）-------------
CHECKPOINT_EVERY_N_EPOCHS: 5
CHECKPOINT_TAIL_EPOCHS: 3

# EVALUATE
# 每 4 个 epoch 评估一次；<=0 表示关闭间隔评估
EVALUATE_EVERY_N_EPOCHS: 5
# 最后 3 个 epoch 每个都评估（16–18）
EVALUATE_TAIL_EPOCHS: 3
EVALUATE_FORCE_EPOCHS: []




