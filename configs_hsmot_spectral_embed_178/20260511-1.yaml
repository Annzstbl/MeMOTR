PROJECT: "2026051模型，两段训练"

AVAILABLE_GPUS: "1"

PARENT_CONFIG: ./default.yaml
OUTPUTS_DIR: /data1/users/litianhao01/experiment/memotr/20260511-1-178
SUBMIT_DIR: /data1/users/litianhao01/experiment/memotr/20260511-1-178


#新增
TRACK_IOU_ADAPTIVE: False
TRACK_IOU_THRESH: 0.3


##不变

# checkpoint
USE_CHECKPOINT: True
DYNAMIC_USE_CHECKPOINT_THRESHOLD: 4
CHECKPOINT_LEVEL: 1         # 1： encoder  2: encoder+decoder  3: encoder+decoder+backbone

# 最佳transform
TRANSFORMS_CONFIG:
  CROP_SIZE:
    - 800
    - 1200
  FLIP_RATIO: 0.5
  RESIZE:
    - 880
    - 960
    - 1040
    - 1120
    - 1200
    - 1280

# === Stage 1 (DETR pretrain) ===
# 当 STAGE1.ENABLE=True 时启用两段训练：
#  - 阶段 1 用此块字段覆盖 yaml 顶层，输出到 OUTPUTS_DIR/stage1_detr/
#  - 阶段 2 用 yaml 顶层字段，自动 PRETRAINED_MODEL=阶段1/last.pth, RESUME=null
#    输出到 OUTPUTS_DIR/stage2_mot/
# 若不想用两段训练，把 ENABLE 设为 False 或删除整个 STAGE1 块即可。
STAGE1:
  ENABLE: True
  EPOCHS: 2
  ONLY_TRAIN_DETR: True
  BATCH_SIZE: 3
  SAMPLE_STEPS: []
  SAMPLE_LENGTHS: [1]
  SAMPLE_INTERVALS: [1]
  LR_DROP_MILESTONES: [12]
  LR_DROP_RATE: 0.1
  # 阶段 1 评估频率（可选；不写则继承顶层）
  EVALUATE_EVERY_N_EPOCHS: 1
  EVALUATE_TAIL_EPOCHS: 2

# === Stage 2 (MOT finetune) === 直接复用以下 yaml 顶层字段
EPOCHS: 18
SAMPLE_STEPS: [4, 8, 12]
SAMPLE_LENGTHS: [2, 3, 4, 5]
SAMPLE_MODES: [random_interval]
SAMPLE_INTERVALS: [3]

LR_SCHEDULER: MultiStep
LR_DROP_RATE: 0.1
LR_DROP_MILESTONES: [16]

# -------------训练配置-------------
TRAIN_HALF: False
ONLY_TRAIN_DETR: False
DATASET_VERSION: OnePic_52_4
NUM_WORKERS: 2
DATASET_TYPE: 3JPG # NPY

# -------------模型配置-------------
ENCODER_SPECTRAL: True
EDGE_SWAP: True
STEM: conv3d_se_v4
MEMOTR_VERSION: '20260511'
USE_Q_SPEC: True
Q_SPEC_LAMBDA: 0.1
TIMING_SYNC_CUDA: False
TIMING_LOG_INTERVAL: 2

# AMP: set USE_AMP True to enable (see PARENT_CONFIG default.yaml for AMP_DTYPE)
USE_AMP: False
AMP_DTYPE: bf16

# -------------SCEM配置-------------
SCEM:
  ENABLE: True
  USE_GT: False
  PRIOR_MODE: gate
  USE_SPECTRAL_PI: True
  SPECTRAL_DATABASE_NUM: 32
  SPECTRAL_TYPE: "pi"

# -------------LOSS配置-------------
LOSS_SCEM_NLL: 1
LOSS_SCEM_BCE: 1
LOSS_SCEM_DICE: 0
LOSS_NLL_CONFIG:
  TYPE: focal # focal or mean
  ALPHA_POS: 1.0
  ALPHA_NEG: 0.1
  GAMMA_POS: 2.0
  GAMMA_NEG: 0.0
LOSS_SCEM_POOL_DIV: 1
LOSS_SCEM_GAMMA_COVER: 1
LOSS_LABEL_TYPE: sigmoid_focal_loss

LOSS_WEIGHT_FOCAL: 10 
LOSS_WEIGHT_GIOU: 2
LOSS_WEIGHT_L1: 5

MATCH_COST_CLASS: 10
MATCH_COST_BBOX: 5
MATCH_COST_GIOU: 2

# -------------CHECKPOINT配置-------------

CHECKPOINT_EVERY_N_EPOCHS: 5
CHECKPOINT_TAIL_EPOCHS: 3

# EVALUATE
# 每 N 个 epoch 评估一次；<=0 表示关闭间隔评估
EVALUATE_EVERY_N_EPOCHS: 3
# 最后多少个 epoch 每个都评估
EVALUATE_TAIL_EPOCHS: 3
# 指定必须评估的 epoch（1-based），例如 [1, 10, 20]
EVALUATE_FORCE_EPOCHS: []






