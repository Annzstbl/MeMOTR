PROJECT: "20260511-nodecode-noencode, decode/encode 均不使用 spectral"

AVAILABLE_GPUS: "1"

PARENT_CONFIG: ../default.yaml
OUTPUTS_DIR: /data1/users/litianhao01/experiment/memotr/debug/20260511-1-nodecode-noencode-178
SUBMIT_DIR: /data1/users/litianhao01/experiment/memotr/debug/20260511-1-nodecode-noencode-178


#新增
TRACK_IOU_ADAPTIVE: False
TRACK_IOU_THRESH: 0.2


##不变

# checkpoint
USE_CHECKPOINT: True
DYNAMIC_USE_CHECKPOINT_THRESHOLD: 4
CHECKPOINT_LEVEL: 1         # 1： encoder  2: encoder+decoder  3: encoder+decoder+backbone

# 最佳transform
TRANSFORMS_CONFIG:
  CROP_SIZE:
    - 800
    - 1200
  FLIP_RATIO: 0.5
  RESIZE:
    - 880
    - 960
    - 1040
    - 1120
    - 1200
    - 1280

SAMPLE_LENGTHS: [2, 3, 4, 5]

# -------------训练配置-------------
TRAIN_HALF: False
ONLY_TRAIN_DETR: False
NUM_WORKERS: 4
DATASET_TYPE: 3JPG # NPY

# -------------模型配置-------------
ENCODER_SPECTRAL: False
EDGE_SWAP: True
STEM: conv3d_se_v4
MEMOTR_VERSION: '20260511_nodecode_noencode'
TIMING_SYNC_CUDA: False
TIMING_LOG_INTERVAL: 10

# -------------SCEM配置-------------
SCEM:
  ENABLE: False
  USE_GT: False
  PRIOR_MODE: gate
  USE_SPECTRAL_PI: False
  SPECTRAL_DATABASE_NUM: 32
  SPECTRAL_TYPE: "pi"
  GRAD_MODE: conservative

# -------------LOSS配置-------------
LOSS_SCEM_NLL: 0
LOSS_SCEM_BCE: 0
LOSS_SCEM_DICE: 0
LOSS_SCEM_POOL_DIV: 0
LOSS_SCEM_GAMMA_COVER: 0
LOSS_NLL_CONFIG:
  TYPE: focal
  ALPHA_POS: 1.0
  ALPHA_NEG: 0.1
  GAMMA_POS: 2.0
  GAMMA_NEG: 0.0
LOSS_LABEL_TYPE: sigmoid_focal_loss
LOSS_WEIGHT_FOCAL: 5
LOSS_WEIGHT_GIOU: 2
MATCH_COST_CLASS: 5
MATCH_COST_BBOX: 5
MATCH_COST_GIOU: 2

# -------------CHECKPOINT配置-------------
CHECKPOINT_EVERY_N_EPOCHS: 5
CHECKPOINT_TAIL_EPOCHS: 3

EVALUATE_EVERY_N_EPOCHS: 5
EVALUATE_TAIL_EPOCHS: 3
EVALUATE_FORCE_EPOCHS: []


# python main.py --config-path /data1/users/litianhao01/hsmot/MeMOTR/configs_hsmot_spectral_embed_178/20260511-nodecode-noencode.yaml
# CUDA_VISIBLE_DEVICES=3 python main.py --config-path /data1/users/litianhao01/hsmot/MeMOTR/configs_hsmot_spectral_embed_178/20260511-nodecode-noencode.yaml
